name: Sync demo extension source

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-demo-source.yml'

permissions:
  contents: write

concurrency:
  group: sync-demo-extension-source
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: site

      - name: Resolve current Stable release
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/drachescript/spicychat-qol-extension/releases/latest \
            | jq -r '.tag_name')"
          test -n "$tag"
          test "$tag" != "null"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout Stable extension source
        uses: actions/checkout@v4
        with:
          repository: drachescript/spicychat-qol-extension
          ref: ${{ steps.stable.outputs.tag }}
          path: extension-stable
          persist-credentials: false

      - name: Checkout Development extension source
        uses: actions/checkout@v4
        with:
          repository: drachescript/spicychat-qol-extension
          ref: main
          path: extension-dev
          persist-credentials: false

      - name: Copy Settings source used by the website demo
        shell: bash
        run: |
          set -euo pipefail
          stable_dir="site/data/demo/stable"
          dev_dir="site/data/demo/dev-current"
          mkdir -p "$stable_dir" "$dev_dir"
          find "$stable_dir" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          find "$dev_dir" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

          copy_source() {
            src="$1"
            dst="$2"
            cp "$src/options.html" "$dst/options.html"
            cp "$src/options.css" "$dst/options.css"
            cp "$src/options.js" "$dst/options.js"
            cp "$src/manifest.json" "$dst/manifest.json"
            cp "$src/CHANGELOG.md" "$dst/CHANGELOG.md"

            # Copy every local script referenced by options.html. This keeps the
            # demo compatible when Settings adds new registry/helper scripts.
            grep -oE '<script[^>]+src="[^"]+"' "$src/options.html" \
              | sed -E 's/.*src="([^"]+)".*/\1/' \
              | while IFS= read -r file; do
                  case "$file" in
                    http:*|https:*|//*|/*|'') continue ;;
                  esac
                  test -f "$src/$file"
                  mkdir -p "$dst/$(dirname "$file")"
                  cp "$src/$file" "$dst/$file"
                done
          }

          copy_source extension-stable "$stable_dir"
          copy_source extension-dev "$dev_dir"

          stable_sha="$(git -C extension-stable rev-parse HEAD)"
          dev_sha="$(git -C extension-dev rev-parse HEAD)"
          printf '{\n  "source": "drachescript/spicychat-qol-extension",\n  "ref": "%s",\n  "commit": "%s"\n}\n' \
            '${{ steps.stable.outputs.tag }}' "$stable_sha" > "$stable_dir/source-meta.json"
          printf '{\n  "source": "drachescript/spicychat-qol-extension",\n  "ref": "main",\n  "commit": "%s"\n}\n' \
            "$dev_sha" > "$dev_dir/source-meta.json"

      - name: Commit synchronized source when changed
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git add data/demo/stable data/demo/dev-current
          if git diff --cached --quiet; then
            echo "Demo source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync demo extension source"
          git pull --rebase origin main
          git push origin HEAD:main
