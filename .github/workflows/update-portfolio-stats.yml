name: Update portfolio store stats

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh public store counts
        run: python scripts/update_portfolio_stats.py

      - name: Commit changed stats
        shell: bash
        run: |
          if git diff --quiet -- data/portfolio-stats.json; then
            echo "No stats change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio-stats.json
          git commit -m "Update portfolio store stats"
          git push
