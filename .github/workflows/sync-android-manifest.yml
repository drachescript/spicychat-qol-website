name: Sync Android manifest

on:
  workflow_dispatch:
  repository_dispatch:
    types: [android-release]
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-android-manifest
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync latest Android release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-android-manifest.mjs

      - name: Commit updated manifest if needed
        shell: bash
        run: |
          if git diff --quiet -- android/manifest.json android/update.json data/site-config.json; then
            echo "Android release metadata is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/manifest.json android/update.json data/site-config.json
          git commit -m "chore: sync Android release metadata [skip ci]"
          git push
