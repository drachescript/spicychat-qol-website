name: QoL Lite Early Access checks

on:
  push:
    branches: [qol-lite-early-access, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check installer JavaScript syntax
        run: node --check assets/js/lite-early-access.js && node --check assets/js/lite-features.js && node --check scripts/test_lite_features.cjs
      - name: Check pinned source files and website links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/test_lite_early_access.py && python scripts/test_lite_experimental.py
      - name: Verify individual feature package closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/test_lite_features.cjs
